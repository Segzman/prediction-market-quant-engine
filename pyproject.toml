[project]
name = "prediction-market-quant-engine"
version = "0.1.0"
description = "Event-contract pricing and execution engine for Polymarket 5-minute BTC contracts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oluwasekunayo Faseyi" }]
dependencies = [
    "py-clob-client>=0.18.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is the formatter's job; long literals (log/alert text) are allowed.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["strategy", "risk", "persistence"]
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["strategy.*", "risk.*", "persistence.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
